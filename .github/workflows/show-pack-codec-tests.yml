name: SHOW Pack metadata codec tests

on:
  pull_request:
    paths:
      - "show-pack-codec.mjs"
      - "show-library-catalog.mjs"
      - "tests/schema6-codec.test.mjs"
      - "tests/schema78-codec.test.mjs"
      - ".github/workflows/show-pack-codec-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Schema 2-9 lossless roundtrip tests (offline)
        run: node --test tests/schema6-codec.test.mjs tests/schema78-codec.test.mjs
